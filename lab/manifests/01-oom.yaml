apiVersion: v1
kind: Pod
metadata:
  name: oom
  namespace: triage-lab
  labels:
    app.kubernetes.io/part-of: triage-lab
  annotations:
    triage-lab/expected: "OOM_KILLED"
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: python:3.12-alpine
      command: ["python", "-c", "b = bytearray(300 * 1024 * 1024); import time; time.sleep(3600)"]
      resources:
        limits: {memory: 64Mi}
