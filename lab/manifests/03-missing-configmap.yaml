apiVersion: v1
kind: Pod
metadata:
  name: missing-configmap
  namespace: triage-lab
  labels:
    app.kubernetes.io/part-of: triage-lab
  annotations:
    triage-lab/expected: "CONFIG_ERROR/missing_configmap"
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: nginx:1.27
      envFrom:
        - configMapRef: {name: api-config}
