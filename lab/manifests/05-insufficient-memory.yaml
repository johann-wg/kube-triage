apiVersion: v1
kind: Pod
metadata:
  name: insufficient-memory
  namespace: triage-lab
  labels:
    app.kubernetes.io/part-of: triage-lab
  annotations:
    triage-lab/expected: "UNSCHEDULABLE/insufficient_resources"
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: nginx:1.27
      resources:
        requests: {memory: 500Gi}
