apiVersion: v1
kind: Pod
metadata:
  name: readiness-probe
  namespace: triage-lab
  labels:
    app.kubernetes.io/part-of: triage-lab
  annotations:
    triage-lab/expected: "PROBE_FAILURE/readiness"
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: nginx:1.27
      readinessProbe:
        httpGet: {path: /ready, port: 80}
        periodSeconds: 3
