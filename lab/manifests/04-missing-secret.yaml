apiVersion: v1
kind: Pod
metadata:
  name: missing-secret
  namespace: triage-lab
  labels:
    app.kubernetes.io/part-of: triage-lab
  annotations:
    triage-lab/expected: "CONFIG_ERROR/missing_secret"
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: nginx:1.27
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef: {name: db-credentials, key: password}
